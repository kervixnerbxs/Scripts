<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowering · Loader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0408;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(200, 50, 130, 0.25) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(230, 60, 150, 0.15) 0%, transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      padding: 20px;
    }

    .card {
      background: rgba(12, 5, 9, 0.8);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-radius: 48px;
      border: 1px solid rgba(255, 100, 180, 0.08);
      padding: 3rem 2.8rem;
      max-width: 700px;
      width: 100%;
      text-align: center;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.9), 0 0 100px rgba(200, 40, 130, 0.05);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.005);
    }

    .logo {
      font-size: 3.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffb8d4, #ff6b9d, #d44a8a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      margin-bottom: 0.2rem;
      filter: drop-shadow(0 0 40px rgba(200, 40, 120, 0.15));
    }

    .sub {
      color: rgba(200, 160, 180, 0.25);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-bottom: 2.2rem;
    }

    .code-block {
      background: #0a0408;
      border-radius: 20px;
      padding: 1.4rem 1.8rem;
      border: 1px solid rgba(255, 100, 180, 0.06);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
      margin-bottom: 1.8rem;
      transition: border-color 0.3s ease;
    }

    .code-block:hover {
      border-color: rgba(255, 100, 180, 0.15);
    }

    .code-block code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 1.1rem;
      color: #f0d8e4;
      word-break: break-all;
      line-height: 1.6;
      letter-spacing: 0.2px;
    }

    .code-block code .hl {
      color: #ff8cb8;
    }

    .code-block code .hl2 {
      color: #ff6b9d;
    }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      background: linear-gradient(145deg, #d44a8a, #901858);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 45px rgba(180, 30, 100, 0.3);
      font-family: inherit;
      text-transform: uppercase;
    }

    .btn-copy:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 16px 60px rgba(200, 40, 120, 0.4);
      background: linear-gradient(145deg, #e05a9a, #a02068);
    }

    .btn-copy:active {
      transform: scale(0.95);
    }

    .btn-copy i {
      font-size: 1rem;
    }

    .footer-note {
      margin-top: 1.8rem;
      font-size: 0.7rem;
      color: rgba(180, 130, 160, 0.12);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 600px) {
      .card { padding: 2rem 1.2rem; border-radius: 32px; }
      .logo { font-size: 2.4rem; }
      .code-block code { font-size: 0.9rem; }
      .btn-copy { width: 100%; justify-content: center; padding: 0.9rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">Flowering</div>
    <div class="sub">Get Script</div>

    <!-- ЧЕРНАЯ СТРОКА С КОДОМ -->
    <div class="code-block">
      <code>
        loadstring(game:HttpGet("<span class="hl">https://raw.githubusercontent.com/kervixnerbxs/Scripts/refs/heads/main/opensrc.lua</span>"))()
      </code>
    </div>

    <!-- КНОПКА КОПИРОВАНИЯ -->
    <button class="btn-copy" id="copyBtn">
      <i class="fas fa-copy"></i> Копировать
    </button>

    <div class="footer-note">2926. flowering</div>
  </div>

  <!-- FONTAWESOME ДЛЯ ИКОНОК -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <script>
    document.getElementById('copyBtn').addEventListener('click', function() {
      const code = `loadstring(game:HttpGet("https://raw.githubusercontent.com/kervixnerbxs/Scripts/refs/heads/main/opensrc.lua"))()`;
      navigator.clipboard.writeText(code).then(() => {
        const original = this.innerHTML;
        this.innerHTML = '<i class="fas fa-check"></i> Скопировано!';
        this.style.background = 'linear-gradient(145deg, #2d8a4e, #1a6a3a)';
        setTimeout(() => {
          this.innerHTML = original;
          this.style.background = '';
        }, 2000);
      }).catch(() => {
        // fallback
        const textarea = document.createElement('textarea');
        textarea.value = code;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
        alert('Код скопирован в буфер обмена!');
      });
    });
  </script>

</body>
</html>
