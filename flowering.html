<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLOWERING</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0408;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(200, 50, 130, 0.25) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(230, 60, 150, 0.15) 0%, transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      padding: 20px;
    }

    .card {
      background: rgba(12, 5, 9, 0.8);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-radius: 48px;
      border: 1px solid rgba(255, 100, 180, 0.08);
      padding: 3rem 2.8rem;
      max-width: 700px;
      width: 100%;
      text-align: center;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.9), 0 0 100px rgba(200, 40, 130, 0.05);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.005);
    }

    .logo {
      font-size: 3.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffb8d4, #ff6b9d, #d44a8a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      margin-bottom: 0.2rem;
      filter: drop-shadow(0 0 40px rgba(200, 40, 120, 0.15));
    }

    .sub {
      color: rgba(200, 160, 180, 0.25);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-bottom: 2.2rem;
    }

    .code-block {
      background: #0a0408;
      border-radius: 20px;
      padding: 1.4rem 1.8rem;
      border: 1px solid rgba(255, 100, 180, 0.06);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
      margin-bottom: 1.8rem;
      transition: border-color 0.3s ease;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .code-block:hover {
      border-color: rgba(255, 100, 180, 0.15);
    }

    .code-block code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 1.1rem;
      color: #f0d8e4;
      word-break: break-all;
      line-height: 1.6;
      letter-spacing: 0.2px;
    }

    .code-block .hl {
      color: #ff8cb8;
    }

    .code-block .hl2 {
      color: #ff6b9d;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      background: linear-gradient(145deg, #d44a8a, #901858);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 45px rgba(180, 30, 100, 0.3);
      font-family: inherit;
      text-transform: uppercase;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 16px 60px rgba(200, 40, 120, 0.4);
      background: linear-gradient(145deg, #e05a9a, #a02068);
    }

    .btn-primary:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none;
    }

    .btn-success {
      background: linear-gradient(145deg, #2d8a4e, #1a6a3a) !important;
    }

    .btn-success:hover:not(:disabled) {
      background: linear-gradient(145deg, #3aa85e, #208040) !important;
    }

    .btn-discord {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      background: #5865F2;
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 30px rgba(88, 101, 242, 0.25);
      font-family: inherit;
      text-transform: uppercase;
      width: 100%;
      text-decoration: none;
    }

    .btn-discord:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 50px rgba(88, 101, 242, 0.4);
      background: #6a77f5;
    }

    .btn-discord i {
      font-size: 1.2rem;
    }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      background: linear-gradient(145deg, #d44a8a, #901858);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 45px rgba(180, 30, 100, 0.3);
      font-family: inherit;
      text-transform: uppercase;
      width: 100%;
    }

    .btn-copy:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 16px 60px rgba(200, 40, 120, 0.4);
      background: linear-gradient(145deg, #e05a9a, #a02068);
    }

    .btn-copy:active {
      transform: scale(0.95);
    }

    .btn-copy i {
      font-size: 1rem;
    }

    .footer-note {
      margin-top: 1.8rem;
      font-size: 0.7rem;
      color: rgba(180, 130, 160, 0.12);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status-text {
      color: rgba(200, 160, 180, 0.3);
      font-size: 0.75rem;
      letter-spacing: 1px;
      margin-top: 0.3rem;
    }

    .status-text .highlight {
      color: #ff8cb8;
    }

    .timer-badge {
      display: inline-block;
      background: rgba(255, 100, 180, 0.08);
      padding: 0.2rem 1rem;
      border-radius: 40px;
      color: rgba(255, 180, 210, 0.3);
      font-size: 0.7rem;
      letter-spacing: 2px;
      border: 1px solid rgba(255, 100, 180, 0.05);
      margin-top: 0.2rem;
      font-family: 'JetBrains Mono', monospace;
      min-width: 80px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .card { padding: 2rem 1.2rem; border-radius: 32px; }
      .logo { font-size: 2.4rem; }
      .code-block code { font-size: 0.9rem; }
      .btn-primary, .btn-discord, .btn-copy { width: 100%; justify-content: center; padding: 0.9rem 1.5rem; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">FLOWERING</div>
  <div class="sub">key system</div>

  <div class="code-block" id="keyDisplay">
    <code>
      <span id="keyText" class="key-display" style="color:rgba(200,160,180,0.2);">⚡ click "GET KEY"</span>
    </code>
  </div>

  <div id="statusArea" class="status-text">
    <span id="statusMessage">waiting</span>
  </div>
  <div id="timerDisplay" class="timer-badge">⏱ 0s</div>

  <div class="btn-group">
    <button class="btn-discord" id="discordBtn">
      <i class="fab fa-discord"></i> GET KEY
    </button>

    <button class="btn-primary hidden" id="generateBtn">
      <i class="fas fa-key"></i> GENERATE KEY
    </button>

    <button class="btn-copy hidden" id="copyBtn">
      <i class="fas fa-copy"></i> COPY KEY
    </button>
  </div>

  <div class="footer-note">2026 · flowering</div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<script>
  (function() {
    const keyText = document.getElementById('keyText');
    const statusMsg = document.getElementById('statusMessage');
    const timerDisplay = document.getElementById('timerDisplay');
    const discordBtn = document.getElementById('discordBtn');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');

    let currentKey = '';
    let timerInterval = null;
    let isWaiting = false;
    let isReady = false;

    function generateKey() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let result = 'FLOWERING_';
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        if (i < 3) result += '-';
      }
      return result;
    }

    function setKey(key) {
      currentKey = key;
      keyText.textContent = key;
      keyText.style.color = '#ffb8d4';
    }

    function setStatus(text, color = 'rgba(200,160,180,0.3)') {
      statusMsg.textContent = text;
      statusMsg.style.color = color;
    }

    function setTimer(seconds) {
      timerDisplay.textContent = `⏱ ${seconds}s`;
    }

    function resetUI() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      isWaiting = false;
      isReady = false;
      discordBtn.disabled = false;
      discordBtn.innerHTML = '<i class="fab fa-discord"></i> GET KEY';
      generateBtn.classList.add('hidden');
      copyBtn.classList.add('hidden');
      setStatus('waiting');
      setTimer(0);
    }

    function startDiscordFlow() {
      if (isWaiting) return;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      window.open('https://discord.gg/s6P7uRUJMH', '_blank');

      isWaiting = true;
      isReady = false;
      discordBtn.disabled = true;
      discordBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 60s';
      generateBtn.classList.add('hidden');
      copyBtn.classList.add('hidden');
      setStatus('waiting for discord...', '#ff8cb8');

      let seconds = 60;
      setTimer(seconds);

      timerInterval = setInterval(() => {
        seconds -= 1;
        discordBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${seconds}s`;
        setTimer(seconds);

        if (seconds <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          isWaiting = false;
          isReady = true;
          discordBtn.disabled = false;
          discordBtn.innerHTML = '<i class="fas fa-check"></i> READY!';
          setStatus('ready to generate', '#ff6b9d');
          generateBtn.classList.remove('hidden');
          generateBtn.classList.add('btn-success');
          setTimer(0);
        }
      }, 1000);
    }

    function handleGenerateKey() {
      if (!isReady) return;
      const newKey = generateKey();
      setKey(newKey);
      copyBtn.classList.remove('hidden');
      setStatus('key generated · 48h valid', '#b0f0b0');
      generateBtn.classList.add('hidden');
      discordBtn.innerHTML = '<i class="fas fa-check"></i> READY!';
      discordBtn.disabled = false;
      isReady = false;
    }

    function handleCopy() {
      if (!currentKey) return;
      navigator.clipboard.writeText(currentKey).then(() => {
        const original = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fas fa-check"></i> COPIED!';
        copyBtn.style.background = 'linear-gradient(145deg, #2d8a4e, #1a6a3a)';
        setTimeout(() => {
          copyBtn.innerHTML = original;
          copyBtn.style.background = '';
        }, 2000);
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = currentKey;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
        const original = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fas fa-check"></i> COPIED!';
        copyBtn.style.background = 'linear-gradient(145deg, #2d8a4e, #1a6a3a)';
        setTimeout(() => {
          copyBtn.innerHTML = original;
          copyBtn.style.background = '';
        }, 2000);
      });
    }

    discordBtn.addEventListener('click', startDiscordFlow);
    generateBtn.addEventListener('click', handleGenerateKey);
    copyBtn.addEventListener('click', handleCopy);

    setKey('click "GET KEY"');
    setStatus('waiting');
    setTimer(0);

    window.addEventListener('beforeunload', function() {
      if (timerInterval) clearInterval(timerInterval);
    });
  })();
</script>

</body>
</html>
