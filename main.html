<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cataclysm Obfuscator/Deobfuscator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0b0d15 0%, #1a1e2c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            padding: 20px;
            margin: 0;
        }

        .card {
            max-width: 700px;
            width: 100%;
            background: rgba(20, 25, 40, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 64px;
            padding: 60px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.15) inset;
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: scale(1.01);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 200, 50, 0.3) inset;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f7971e, #ffd200, #f7971e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255, 200, 0, 0.3), 0 0 60px rgba(255, 100, 0, 0.2);
            animation: shimmer 4s ease-in-out infinite alternate;
            margin-bottom: 28px;
            word-break: break-word;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        .sub-glow {
            font-size: 1rem;
            color: rgba(200, 180, 255, 0.5);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: 300;
            border-top: 1px solid rgba(255, 215, 0, 0.15);
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            display: inline-block;
            padding: 8px 20px;
            backdrop-filter: blur(4px);
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-rickroll {
            display: inline-block;
            background: linear-gradient(145deg, #2b1f0e, #1f160a);
            border: 2px solid #f0b300;
            border-radius: 80px;
            padding: 18px 48px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffde7a;
            text-shadow: 0 0 12px rgba(255, 200, 0, 0.4);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(255, 200, 0, 0.2), 0 8px 0 #0f0c06;
            transition: all 0.15s ease-in-out;
            cursor: pointer;
            width: auto;
            min-width: 260px;
            backdrop-filter: blur(2px);
            position: relative;
            margin-top: 12px;
        }

        .btn-rickroll::after {
            content: "⚡";
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.8rem;
            filter: drop-shadow(0 0 8px gold);
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .btn-rickroll:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6), 0 10px 0 #0f0c06;
            background: linear-gradient(145deg, #3f2d12, #281e0c);
            border-color: #ffd966;
            color: #ffeeaa;
            text-shadow: 0 0 25px #ffb347;
        }

        .btn-rickroll:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #0f0c06;
        }

        .glow-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 38px;
            opacity: 0.5;
        }

        .glow-dots span {
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #f7c948, #d4880f);
            border-radius: 50%;
            box-shadow: 0 0 18px #f0a500;
            animation: pulse-dot 2.2s infinite alternate;
        }

        .glow-dots span:nth-child(2) {
            animation-delay: 0.6s;
            background: radial-gradient(circle, #ffb347, #b45f06);
        }
        .glow-dots span:nth-child(3) {
            animation-delay: 1.2s;
            background: radial-gradient(circle, #ffd966, #a67c00);
        }

        @keyframes pulse-dot {
            0% {
                opacity: 0.3;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        @media (max-width: 550px) {
            .card {
                padding: 40px 24px;
                border-radius: 40px;
            }
            h1 {
                font-size: 2.3rem;
            }
            .btn-rickroll {
                font-size: 1.3rem;
                padding: 16px 24px;
                min-width: 200px;
            }
            .btn-rickroll::after {
                display: none;
            }
            .sub-glow {
                font-size: 0.7rem;
                letter-spacing: 3px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
      
        <h1>Cataclysm<br />Obfuscator/Deobfuscator</h1>

        <div class="sub-glow"> class α · ω </div>

        <a href="https://youtu.be/dQw4w9WgXcQ?list=RDdQw4w9WgXcQ" 
           target="_blank" 
           rel="noopener noreferrer"
           class="btn-rickroll">
            Go to deobfuscate/obfuscatе
        </a>
        <div class="glow-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

</body>
</html>
